<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vallumbría</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0809">
<meta name="description" content="RPG textual sobrenatural numa cidadezinha do interior da Espanha. Vampiros, lobisomens, feiticeiros e humanos sob um pacto antigo.">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Grenze+Gotisch:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: o livro de registros de uma cidade antiga, lacrado em cera cor de sangue.
   Noite quase preta com fundo de vinho, faixas de pergaminho para o que a cidade mostra ao público,
   títulos em gótico, texto corrido em serifa de livro e controles em sans para leitura rápida. */
:root {
  color-scheme: dark;
  --night: #0D0809;
  --night-2: #171011;
  --night-3: #221718;
  --line: #36272A;
  --line-2: #574044;
  --bone: #EDE3D6;
  --bone-2: #C4B5A5;
  --bone-3: #94857A;
  --blood: #C0303B;
  --blood-deep: #6A121B;
  --wine: #2B0D12;
  --brass: #B89B72;
  --parch: #E7DBC7;
  --parch-2: #D8C9B0;
  --parch-ink: #2A1A17;
  --parch-ink-2: #5E4A40;
  --ok: #8FBF9A;
  --warn: #DDAA4B;
  --info: #AE93D6;
  --danger: #F08A8F;
  --f-display: "Grenze Gotisch", "Luminari", "Palatino Linotype", Georgia, serif;
  --f-prose: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
  --max: 1120px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--night); color: var(--bone); font-family: var(--f-prose); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--night); }
img { max-width: 100%; display: block; }
img[data-ref]:not([src]) { visibility: hidden; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--blood); color: #fff; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
#view:focus { outline: none; }

.wrap { width: 100%; max-width: calc(var(--max) + 64px); margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* ---------- Tipografia ---------- */
.eyebrow { font-family: var(--f-ui); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); margin: 0; }
.display { font-family: var(--f-display); font-weight: 500; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1, h2, h3, h4 { text-wrap: balance; }
.sec-title { font-family: var(--f-display); font-weight: 500; font-size: clamp(30px, 5vw, 44px); line-height: 1.08; margin: 0; }
.h3 { font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 3vw, 28px); line-height: 1.15; margin: 0; }
.lead { font-size: clamp(18px, 2.3vw, 21px); line-height: 1.6; color: var(--bone-2); max-width: 38em; margin: 0; }
.muted { color: var(--bone-3); }
.ui { font-family: var(--f-ui); }
.small { font-family: var(--f-ui); font-size: 13px; color: var(--bone-3); }
.prose p { margin: 0 0 1em; max-width: 64ch; color: var(--bone-2); }
.prose p:last-child { margin-bottom: 0; }
.dropcap::first-letter { font-family: var(--f-display); float: left; font-size: 3.6em; line-height: .82; margin: .08em .1em 0 0; color: var(--blood); }
.orn { display: flex; align-items: center; gap: 14px; color: var(--brass); font-size: 14px; margin: 0; }
.orn::before, .orn::after { content: ""; height: 1px; background: linear-gradient(90deg, transparent, currentColor); flex: 1; opacity: .6; }
.orn::after { background: linear-gradient(270deg, transparent, currentColor); }
.sec { padding-block: clamp(44px, 7vw, 84px); }
.sec-head { display: grid; gap: 8px; margin-bottom: clamp(22px, 3.5vw, 36px); }
.sub-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin: clamp(30px, 5vw, 52px) 0 16px; }
.sub-head:first-child { margin-top: 0; }

/* ---------- Botões ---------- */
.btn { font-family: var(--f-ui); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 6px; border: 1px solid transparent; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .2s ease, border-color .2s ease, transform .15s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--blood); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 24px -12px var(--blood); }
.btn-primary:hover { background: #D03A46; }
.btn-ghost { background: rgba(23, 16, 17, .6); color: var(--bone); border-color: var(--line-2); }
.btn-ghost:hover { border-color: var(--brass); }
.btn-quiet { background: transparent; color: var(--bone-2); padding: 0 10px; }
.btn-quiet:hover { color: var(--bone); }
.btn-danger { background: transparent; color: var(--danger); border-color: rgba(240, 138, 143, .45); }
.btn-ok { background: var(--ok); color: #10200F; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-xs { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.on-parch .btn-ghost { background: transparent; color: var(--parch-ink); border-color: var(--parch-ink-2); }

/* ---------- Cabeçalho ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(13, 8, 9, .88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; min-height: 62px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.logo-ic { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: 52% 48%; border: 1px solid var(--blood-deep); box-shadow: 0 0 0 2px var(--night), 0 0 0 3px var(--line-2); flex: none; background: var(--wine); }
.logo-t { font-family: var(--f-display); font-size: 25px; font-weight: 500; line-height: 1; white-space: nowrap; }
.nav { display: none; gap: 0; margin-left: auto; font-family: var(--f-ui); }
.nav a { text-decoration: none; font-size: 14px; font-weight: 600; color: var(--bone-2); padding: 8px 10px; border-radius: 6px; }
.nav a:hover { color: var(--bone); }
.nav a[aria-current="page"] { color: var(--bone); box-shadow: inset 0 -2px 0 var(--blood); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.chip-user { font-family: var(--f-ui); display: inline-flex; align-items: center; gap: 8px; max-width: 160px; min-height: 38px; padding: 0 12px 0 5px; border-radius: 999px; text-decoration: none; background: var(--night-3); border: 1px solid var(--line-2); font-size: 14px; font-weight: 600; }
.chip-user span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--blood-deep); color: var(--bone); font-family: var(--f-ui); font-weight: 700; font-size: 13px; }
.menu-btn { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--night-2); display: grid; place-items: center; cursor: pointer; }
@media (max-width: 479px) { .chip-user { padding: 0 4px; } .chip-user span:last-child { display: none; } .logo-t { font-size: 22px; } }
@media (min-width: 1100px) { .nav { display: flex; } .top-actions { margin-left: 6px; } .menu-btn { display: none; } }
.drawer { position: fixed; inset: 0; z-index: 70; background: rgba(5, 2, 3, .75); display: flex; justify-content: flex-end; }
.drawer-panel { width: min(340px, 88vw); height: 100%; background: var(--night-2); border-left: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 16px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 22px; display: flex; flex-direction: column; overflow-y: auto; }
.drawer-panel a { text-decoration: none; padding: 13px 2px; border-bottom: 1px solid var(--line); font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
.drawer-panel a[aria-current="page"] { color: var(--blood); }
.demo-bar { background: var(--wine); border-bottom: 1px solid var(--blood-deep); font-family: var(--f-ui); }
.demo-bar .wrap { display: flex; gap: 6px 10px; align-items: center; padding-block: 8px; font-size: 13px; color: var(--bone-2); flex-wrap: wrap; }
.demo-bar b { color: var(--brass); letter-spacing: .12em; font-size: 11px; text-transform: uppercase; }

/* ---------- Capa ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #3A0D14 0%, var(--wine) 38%, var(--night) 78%); border-bottom: 1px solid var(--line); }
.hero .wrap { padding-block: clamp(28px, 6vw, 64px) clamp(36px, 6vw, 64px); display: grid; gap: 20px; justify-items: center; text-align: center; }
.hero-art { width: min(100%, 980px); border-radius: 4px; }
.hero-art img { width: 100%; height: auto; -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent), linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent), linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent); mask-composite: intersect; }
.hero-name { font-size: clamp(56px, 15vw, 150px); color: var(--bone); text-shadow: 0 0 40px rgba(192, 48, 59, .45); }
.hero-lema { font-family: var(--f-ui); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--brass); margin: 0; }
.hero-tag { font-size: clamp(19px, 2.6vw, 24px); font-style: italic; line-height: 1.45; max-width: 26em; margin: 0; color: var(--bone); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page-hero { position: relative; isolation: isolate; overflow: hidden; background: linear-gradient(180deg, var(--wine), var(--night)); border-bottom: 1px solid var(--line); }
.page-hero.has-img { background: var(--night-2) center / cover no-repeat; }
.page-hero.has-img::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(13, 8, 9, .35), rgba(13, 8, 9, .72) 55%, var(--night)); }
.page-hero > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.page-hero .wrap { padding-block: clamp(44px, 9vw, 96px) clamp(24px, 4vw, 44px); display: grid; gap: 10px; }
.page-hero h1 { font-size: clamp(40px, 8vw, 78px); overflow-wrap: break-word; }
.page-hero .lead { color: var(--bone); }
.crumb { font-family: var(--f-ui); font-size: 13px; color: var(--bone-2); text-decoration: none; }
.crumb:hover { color: var(--bone); }

/* ---------- Blocos ---------- */
.panel { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 26px); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.split { display: grid; gap: 28px; }
@media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 52px; } .split-aside { position: sticky; top: 92px; align-self: start; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 0; }
.facts > div { background: var(--night-2); padding: 14px 16px; }
.facts dt { font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--bone-3); }
.facts dd { margin: 2px 0 0; font-family: var(--f-ui); font-weight: 600; font-size: 15px; }
.trait { display: grid; gap: 3px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--night-2); border: 1px solid var(--line); margin: 0; }
.trait dt { font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--fac, var(--brass)); }
.trait dd { margin: 0; color: var(--bone-2); font-size: 16px; line-height: 1.5; }
.tag { font-family: var(--f-ui); display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 4px; border: 1px solid currentColor; line-height: 1.3; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.pill { font-family: var(--f-ui); display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.3; white-space: nowrap; background: rgba(13, 8, 9, .8); border: 1px solid; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-livre { color: var(--ok); } .st-reservada { color: var(--warn); } .st-analise { color: var(--info); } .st-ocupada { color: var(--bone-3); } .st-ajustes { color: #E7A777; } .st-bad { color: var(--danger); }
.meter { display: grid; gap: 6px; }
.meter-bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--night-3); gap: 2px; }
.meter-bar i { display: block; height: 100%; }
.m-livre { background: var(--ok); } .m-reservada { background: var(--warn); } .m-analise { background: var(--info); } .m-ocupada { background: var(--bone-3); }
.meter-txt { font-family: var(--f-ui); font-size: 13px; color: var(--bone-3); font-variant-numeric: tabular-nums; }
.callout { padding: 14px 16px; border-radius: var(--r-sm); background: var(--night-3); border-left: 3px solid var(--warn); font-size: 16px; }
.callout b { display: block; font-family: var(--f-ui); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--warn); margin-bottom: 2px; }
.callout.c-ok { border-left-color: var(--ok); } .callout.c-ok b { color: var(--ok); }
.callout.c-info { border-left-color: var(--info); } .callout.c-info b { color: var(--info); }
.empty { padding: 22px; border-radius: var(--r); border: 1px dashed var(--line-2); color: var(--bone-2); display: grid; gap: 12px; justify-items: start; }
.confirm-box { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-sm); background: var(--night-3); border: 1px solid var(--line-2); font-size: 15px; font-family: var(--f-ui); }
.edit-link { font-family: var(--f-ui); font-size: 12px; font-weight: 700; color: var(--brass); background: rgba(13, 8, 9, .7); border: 1px dashed var(--brass); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }

/* ---------- Faixa de pergaminho ---------- */
.parch { background: var(--parch); color: var(--parch-ink); border-block: 1px solid #000; background-image: radial-gradient(120% 140% at 50% 0%, rgba(255, 255, 255, .35), transparent 60%), repeating-linear-gradient(0deg, rgba(94, 74, 64, .05) 0 1px, transparent 1px 4px); }
.parch .eyebrow { color: var(--blood-deep); }
.parch .muted, .parch .small { color: var(--parch-ink-2); }
.parch .prose p { color: var(--parch-ink); }
.parch :focus-visible { outline-color: var(--blood-deep); }

/* ---------- Fotos ---------- */
.tile { position: relative; margin: 0; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-sm); overflow: hidden; background: linear-gradient(160deg, var(--wine), var(--night-2)); border: 1px solid var(--line); isolation: isolate; display: block; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile.ph::before { content: "✦"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: var(--blood-deep); }
[data-act="zoom"] { cursor: zoom-in; }
.zoom-badge { position: absolute; top: 8px; right: 8px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(13, 8, 9, .72); color: var(--bone); border: 1px solid rgba(237, 227, 214, .25); pointer-events: none; }
.zoom-badge svg { width: 13px; height: 13px; }

/* ---------- Locais ---------- */
.loc-card { display: grid; grid-template-rows: auto 1fr; text-decoration: none; border-radius: var(--r); overflow: hidden; background: var(--night-2); border: 1px solid var(--line); transition: border-color .2s ease, transform .2s ease; }
.loc-card:hover { border-color: var(--brass); transform: translateY(-2px); }
.loc-card .tile { border: 0; border-radius: 0; aspect-ratio: 16 / 10; }
.loc-card div { padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; }
.loc-card h3 { font-family: var(--f-display); font-weight: 500; font-size: 26px; line-height: 1.1; margin: 0; }
.loc-card p { margin: 0; color: var(--bone-2); font-size: 16px; line-height: 1.5; }
.loc-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 132px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
@media (min-width: 900px) { .loc-strip { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); overflow: visible; } }
.loc-mini { text-decoration: none; display: grid; gap: 6px; color: var(--parch-ink); }
.loc-mini .tile { aspect-ratio: 3 / 4; border-color: var(--parch-ink); box-shadow: 0 0 0 3px var(--parch), 0 0 0 4px var(--blood-deep); margin: 4px; }
.loc-mini span { font-family: var(--f-display); font-size: 19px; line-height: 1.1; text-align: center; }
.loc-mini:hover span { color: var(--blood-deep); }
.who { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.who li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--night-2); font-family: var(--f-ui); font-size: 14px; }
.who li span:first-child { min-width: 0; overflow-wrap: anywhere; }

/* ---------- Esta noite ---------- */
.tonight { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 20px; align-items: center; }
.tonight svg { width: 84px; height: 84px; }
.tonight h3 { font-family: var(--f-display); font-weight: 500; font-size: 30px; line-height: 1.05; margin: 0; }
.tonight dl { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 16px; margin: 0; padding-top: 14px; border-top: 1px solid var(--line); }
.tonight dt { font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--bone-3); }
.tonight dd { margin: 0; font-family: var(--f-ui); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Espécies e vagas ---------- */
.esp-card { --fac: var(--brass); position: relative; display: grid; gap: 10px; padding: 20px; border-radius: var(--r); background: var(--night-2); border: 1px solid var(--line); border-top: 3px solid var(--fac); text-decoration: none; transition: transform .2s ease, border-color .2s ease; }
.esp-card:hover { transform: translateY(-2px); border-color: var(--fac); }
.esp-card h3 { font-family: var(--f-display); font-weight: 500; font-size: 30px; line-height: 1; margin: 0; }
.esp-card p { margin: 0; color: var(--bone-2); font-size: 16px; line-height: 1.5; }
.esp-card .meter { margin-top: auto; }
.esp-sec { --fac: var(--brass); border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.esp-head { display: grid; gap: 22px; align-items: center; }
@media (min-width: 820px) { .esp-head { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 40px; } }
.esp-head h2 { font-family: var(--f-display); font-weight: 500; font-size: clamp(44px, 8vw, 76px); line-height: .95; margin: 0; color: var(--fac); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { font-family: var(--f-ui); flex: none; min-height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--night-2); font-size: 14px; font-weight: 600; color: var(--bone-2); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--bone); color: var(--night); border-color: var(--bone); }
.chip .n { opacity: .65; font-variant-numeric: tabular-nums; font-size: 12px; }
.filters { display: grid; gap: 10px; margin-bottom: 20px; }
.slots { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .slots { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); } }
.slot { --fac: var(--brass); display: grid; grid-template-columns: 96px minmax(0, 1fr); border-radius: var(--r); overflow: hidden; background: var(--night-2); border: 1px solid var(--line); }
@media (min-width: 620px) { .slot { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
.slot-img { position: relative; background: var(--night-3); aspect-ratio: 3 / 4; max-width: 100%; min-height: 100%; overflow: hidden; }
@media (min-width: 620px) { .slot-img { aspect-ratio: 4 / 4.4; } }
.slot-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot-ph { position: absolute; inset: 0; display: grid; place-items: end center; background: radial-gradient(90% 70% at 50% 25%, var(--wine), var(--night-3) 75%); }
.slot-ph svg { width: 76%; height: auto; color: #120B0C; }
.slot-img .pill { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 11px; }
@media (max-width: 619px) { .slot-img .pill { display: none; } }
.slot-body { display: flex; flex-direction: column; gap: 5px; padding: 14px 16px 16px; min-width: 0; }
.slot-role { font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fac); margin: 0; }
.slot-name { font-family: var(--f-display); font-weight: 500; font-size: 24px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.slot-desc { margin: 0; color: var(--bone-2); font-size: 15px; line-height: 1.5; }
.slot-meta { margin: 2px 0 0; font-family: var(--f-ui); font-size: 13px; color: var(--bone-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (min-width: 620px) { .slot-meta .pill { display: none; } }
.slot-actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Jornal ---------- */
.paper { border-radius: 4px; padding: clamp(18px, 4vw, 40px); box-shadow: 0 30px 60px -30px #000; }
.masthead { text-align: center; border-bottom: 3px double var(--parch-ink); padding-bottom: 14px; margin-bottom: 18px; display: grid; gap: 4px; }
.masthead h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(38px, 8vw, 72px); line-height: 1; margin: 0; }
.masthead p { margin: 0; font-family: var(--f-ui); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--parch-ink-2); }
.parch .chip { background: transparent; border-color: var(--parch-ink-2); color: var(--parch-ink); }
.parch .chip[aria-pressed="true"] { background: var(--parch-ink); color: var(--parch); border-color: var(--parch-ink); }
.posts { display: grid; gap: 0; }
.post { display: grid; gap: 8px; padding: 20px 0; border-bottom: 1px solid var(--parch-2); }
.post:last-child { border-bottom: 0; }
.post-meta { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; font-family: var(--f-ui); font-size: 12px; color: var(--parch-ink-2); font-variant-numeric: tabular-nums; }
.post-meta .tag { color: var(--blood-deep); }
.post h3 { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; margin: 0; }
.post .tile { max-width: 420px; border-color: var(--parch-ink); filter: sepia(.35); }
.post-reward { font-family: var(--f-ui); font-weight: 700; color: var(--blood-deep); }
.mural { display: grid; gap: 10px; }
.mural a { text-decoration: none; display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--night-2); }
.mural a:hover { border-color: var(--brass); }
.mural b { font-family: var(--f-display); font-weight: 500; font-size: 20px; line-height: 1.15; }

/* ---------- Regras ---------- */
.rules { list-style: none; counter-reset: r; margin: 0; padding: 0; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
.rules li:last-child { border-bottom: 1px solid var(--line); }
.rules li::before { content: counter(r, upper-roman); font-family: var(--f-display); font-size: 26px; color: var(--blood); line-height: 1.1; }
.rules h3 { margin: 0 0 2px; font-family: var(--f-ui); font-size: 17px; }
.rules p { margin: 0; color: var(--bone-2); max-width: 62ch; }

/* ---------- Formulários ---------- */
.form { display: grid; gap: 14px; font-family: var(--f-ui); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 700; color: var(--bone-2); }
.hint { font-size: 12px; color: var(--bone-3); font-weight: 500; }
.input, .textarea, select.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--night); color: var(--bone); font-size: 16px; line-height: 1.5; font-family: var(--f-ui); }
.textarea { min-height: 110px; resize: vertical; }
.input:focus, .textarea:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(184, 155, 114, .2); }
input[type="color"].input { padding: 4px; width: 64px; }
.row2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.err { color: var(--danger); font-size: 14px; margin: 0; font-family: var(--f-ui); }
.seg { display: inline-flex; padding: 4px; border-radius: 10px; background: var(--night); border: 1px solid var(--line-2); gap: 2px; flex-wrap: wrap; font-family: var(--f-ui); }
.seg button { border: 0; background: transparent; padding: 8px 12px; border-radius: 7px; font-size: 14px; font-weight: 700; color: var(--bone-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--night-3); color: var(--bone); box-shadow: inset 0 -2px 0 var(--blood); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 15px; font-family: var(--f-ui); }
.switch input { width: 20px; height: 20px; accent-color: var(--blood); }
.imgf { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
.imgf .tile { aspect-ratio: 1; }
.imgf-ctl { display: grid; gap: 8px; }

/* ---------- Painel ---------- */
.dash { display: grid; gap: 20px; }
.dash-hello { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-family: var(--f-ui); }
.dash-hello .avatar { width: 46px; height: 46px; font-size: 19px; }
.dash-hello h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 30px; line-height: 1.1; }
.mine-head { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 16px; align-items: center; }
.mine-head .slot-img { aspect-ratio: 3 / 4; border-radius: var(--r-sm); min-height: 0; }
.mine-head .slot-img .pill { display: none; }
.deadline { font-family: var(--f-ui); font-size: 13px; color: var(--bone-2); font-variant-numeric: tabular-nums; }
.deadline.late { color: var(--danger); }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-row code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--night); border: 1px solid var(--line-2); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; user-select: all; flex: 1 1 220px; min-width: 0; }
.ficha-view { display: grid; gap: 14px; margin: 0; }
.ficha-view dt { font-family: var(--f-ui); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--bone-3); }
.ficha-view dd { margin: 2px 0 0; color: var(--bone-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.attrs { display: grid; gap: 10px; }
.attr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--night); font-family: var(--f-ui); }
.attr b { font-size: 15px; }
.attr small { grid-column: 1; color: var(--bone-3); font-size: 13px; }
.stepper { grid-row: 1 / span 2; grid-column: 2; display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--night-3); cursor: pointer; font-size: 18px; font-weight: 700; }
.stepper button[disabled] { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 22px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 14px; height: 8px; border-radius: 2px; background: var(--night-3); border: 1px solid var(--line-2); }
.pips i.on { background: var(--blood); border-color: var(--blood); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px; border-radius: var(--r-sm); background: var(--night); border: 1px solid var(--line); display: grid; gap: 2px; font-family: var(--f-ui); }
.kpi b { font-family: var(--f-display); font-weight: 500; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--bone-3); }
.xpbar { height: 10px; border-radius: 99px; background: var(--night-3); overflow: hidden; border: 1px solid var(--line); }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blood-deep), var(--blood)); }
.inv { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--f-ui); }
.inv li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--night); }
.inv li b { font-variant-numeric: tabular-nums; color: var(--brass); }
.queue { display: grid; gap: 10px; }
.q-item { --fac: var(--brass); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--night); overflow: hidden; }
.q-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px 12px 0; cursor: pointer; width: 100%; border: 0; background: transparent; text-align: left; font-family: var(--f-ui); }
.q-row::before { content: ""; align-self: stretch; background: var(--fac); }
.q-main { display: grid; gap: 2px; min-width: 0; }
.q-main b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-main small { color: var(--bone-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-detail { padding: 14px 16px 16px; display: grid; gap: 14px; border-top: 1px solid var(--line); }
.secret { padding: 12px 14px; border-radius: var(--r-sm); border: 1px dashed var(--line-2); font-size: 15px; color: var(--bone-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.secret b { display: block; font-family: var(--f-ui); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--blood); }

/* ---------- Mercado ---------- */
.item { display: grid; gap: 8px; padding: 16px 18px; border-radius: var(--r); background: var(--night-2); border: 1px solid var(--line); align-content: start; }
.item.off { border-style: dashed; opacity: .8; }
.item h3 { font-family: var(--f-display); font-weight: 500; font-size: 24px; line-height: 1.1; margin: 0; }
.item p { margin: 0; color: var(--bone-2); font-size: 15px; line-height: 1.5; }
.item-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; font-family: var(--f-ui); }
.price { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.price small { font-family: var(--f-ui); font-size: 12px; color: var(--bone-3); }
.qty { width: 64px; min-height: 38px; padding: 6px 8px; }

/* ---------- Editor ---------- */
.ed-bar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 20; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: rgba(34, 23, 24, .96); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -10px #000; font-family: var(--f-ui); margin-top: 18px; }
.ed-bar .state { font-size: 14px; color: var(--bone-3); }
.ed-bar.dirty .state { color: var(--warn); }
.ed-list { display: grid; gap: 8px; }
.ed-item { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--night); }
.ed-item.open { border-color: var(--brass); }
.ed-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-family: var(--f-ui); }
.ed-row .t { flex: 1; min-width: 0; display: grid; gap: 0; cursor: pointer; background: none; border: 0; text-align: left; padding: 4px 2px; }
.ed-row .t b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-row .t small { font-size: 12px; color: var(--bone-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--night-3); cursor: pointer; display: grid; place-items: center; font-size: 14px; flex: none; font-family: var(--f-ui); }
.icon-btn[disabled] { opacity: .3; cursor: not-allowed; }
.ed-body { padding: 14px; border-top: 1px solid var(--line); }

/* ---------- Modal, foto ampliada, aviso ---------- */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(5, 2, 3, .78); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 720px) { .modal { align-items: center; padding: 24px; } }
.modal-card { --fac: var(--brass); width: min(640px, 100%); max-height: 92vh; overflow-y: auto; background: var(--night-2); border: 1px solid var(--line-2); border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 720px) { .modal-card { border-radius: 16px; max-height: 88vh; } }
.modal-top { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 18px 18px 0; align-items: end; }
.modal-top .slot-img { border-radius: var(--r-sm); aspect-ratio: 3 / 4; min-height: 0; }
.modal-top .slot-img .pill { display: none; }
.modal-body { padding: 18px 18px 22px; display: grid; gap: 16px; }
.modal-close { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 10px 10px 0; z-index: 2; margin-bottom: -46px; }
.lightbox { position: fixed; inset: 0; z-index: 95; background: rgba(5, 2, 3, .97); display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 60px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.lb-fig { margin: 0; display: grid; gap: 12px; justify-items: center; max-width: 100%; max-height: 100%; }
.lb-fig img { max-width: 100%; max-height: calc(100vh - 150px); width: auto; height: auto; object-fit: contain; border-radius: 6px; }
.lb-fig figcaption { font-family: var(--f-display); font-size: 22px; color: var(--bone-2); text-align: center; }
.lb-close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); }
.round-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--night-3); cursor: pointer; display: grid; place-items: center; }
.toast { font-family: var(--f-ui); position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 99; max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 8px; background: var(--bone); color: var(--night); font-weight: 700; font-size: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
.toast.bad { background: var(--danger); }

/* ---------- Rodapé ---------- */
.foot { border-top: 1px solid var(--line); margin-top: 24px; }
.foot .wrap { padding-block: 34px 42px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.foot-name { font-family: var(--f-display); font-size: 38px; line-height: 1; }
.foot-links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--f-ui); font-size: 14px; justify-content: center; }
.foot-links a { color: var(--bone-2); text-decoration: none; }
.foot-links a:hover { color: var(--bone); }
.cta { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--r); border: 1px solid var(--blood-deep); background: radial-gradient(90% 140% at 100% 50%, #4A1018, var(--wine) 55%, var(--night-2)); display: grid; gap: 20px; align-items: center; padding: clamp(24px, 5vw, 48px); }
@media (min-width: 760px) { .cta { grid-template-columns: minmax(0, 1fr) 220px; } }
.cta h2 { font-family: var(--f-display); font-weight: 500; font-size: clamp(32px, 5vw, 50px); line-height: 1.02; margin: 0; }
.cta-ic { width: min(220px, 60%); aspect-ratio: 1; border-radius: 50%; object-fit: cover; object-position: 52% 48%; border: 1px solid var(--blood-deep); box-shadow: 0 0 0 6px var(--night), 0 0 0 7px var(--blood-deep), 0 0 60px -10px var(--blood); justify-self: center; }
.loading { padding: 90px 0; text-align: center; color: var(--bone-3); font-family: var(--f-ui); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; }
/* ---------- Blocos livres (grade de 12 colunas) ---------- */
.cgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; padding-block: 28px; align-items: start; }
.cb { grid-column: span 12; min-width: 0; }
.cb.w-8 { grid-column: span 8; } .cb.w-6 { grid-column: span 6; } .cb.w-4 { grid-column: span 4; }
@media (max-width: 720px) { .cb.w-8, .cb.w-6, .cb.w-4 { grid-column: span 12; } }
.cb .tile.cb-pic { aspect-ratio: auto; min-height: 120px; }
.cb .tile.cb-pic img { position: static; width: 100%; height: auto; }
.cb .tile.cb-pic.ph { aspect-ratio: 16 / 9; }
.cb-title { font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 4vw, 40px); line-height: 1.08; margin: 0 0 10px; }
.cb-text { margin: 0; color: var(--bone-2); max-width: 70ch; white-space: pre-line; }
.cb-cap { margin: 10px 0 0; font-family: var(--f-ui); font-size: 14px; color: var(--bone-3); }
.cb-ft { display: grid; gap: 22px; align-items: center; }
@media (min-width: 760px) { .cb-ft { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; } .cb-ft.rev > div:first-child { order: 2; } }
.cb-body { display: grid; gap: 4px; min-width: 0; }
.cb-up { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.prose p[data-e], p[data-e] { white-space: pre-line; }

/* ---------- Modo de edição ---------- */
body.em [data-e] { outline: 1px dashed rgba(184, 155, 114, .55); outline-offset: 3px; border-radius: 3px; cursor: text; min-width: 1ch; }
body.em [data-e]:hover { outline-color: var(--brass); }
body.em [data-e]:focus { outline: 2px solid var(--brass); background: rgba(184, 155, 114, .08); }
body.em [data-e]:empty::before { content: attr(data-ph); color: var(--bone-3); font-style: italic; opacity: .8; }
body.em .parch [data-e] { outline-color: rgba(106, 18, 27, .5); }
body.em .hero-lema[data-e], body.em .eyebrow[data-e] { display: inline-block; }
.blk { position: relative; }
body.em .blk { outline: 1px dashed transparent; outline-offset: -1px; }
body.em .blk:hover, body.em .blk:focus-within { outline-color: rgba(192, 48, 59, .55); }
.blk-tools { position: absolute; top: 8px; right: max(8px, env(safe-area-inset-right, 0px)); z-index: 30; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; padding: 4px; border-radius: 10px; background: rgba(23, 16, 17, .94); border: 1px solid var(--line-2); box-shadow: 0 8px 24px -8px #000; font-family: var(--f-ui); max-width: calc(100% - 16px); }
.cb .blk-tools { position: relative; top: 0; right: 0; margin-bottom: 10px; justify-content: flex-start; }
.bt { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--night-3); color: var(--bone); cursor: pointer; font-size: 13px; font-weight: 700; }
.bt[disabled] { opacity: .3; cursor: not-allowed; }
.bt.on { background: var(--bone); color: var(--night); }
.bt.bad { color: var(--danger); }
.bt-group { display: inline-flex; gap: 2px; }
.blk-handle { cursor: grab; touch-action: none; font-size: 18px; line-height: 1; }
.blk.dragging { opacity: .45; }
.blk[data-drop="before"] { box-shadow: inset 0 4px 0 var(--blood); }
.blk[data-drop="after"] { box-shadow: inset 0 -4px 0 var(--blood); }
.blk[data-drop="left"] { box-shadow: inset 4px 0 0 var(--blood); }
.blk[data-drop="right"] { box-shadow: inset -4px 0 0 var(--blood); }
.ins-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 10px; font-family: var(--f-ui); font-size: 13px; color: var(--bone-3); border-top: 1px dashed var(--line-2); }
